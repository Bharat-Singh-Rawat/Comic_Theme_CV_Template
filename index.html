<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Singh Rawat, Ph.D. // Into the Multiverse</title>
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Fira+Code:wght@400;700&family=Oswald:wght@700&display=swap');

        :root {
            --spider-red: #ff0037; --spider-blue: #2e3192; --glitch-cyan: #00ffff;
            --glitch-magenta: #ff00ff; --comic-yellow: #fff200; --void-black: #050505;
            --dim-bg: #050505;
        }

        body, html {
            margin: 0; padding: 0; background-color: var(--dim-bg); color: #fff;
            font-family: 'Fira Code', monospace; overflow-x: hidden; cursor: crosshair;
            transition: background-color 1.2s ease;
        }

        /* --- DIMENSION COUNTER HUD --- */
        #dimension-hud {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            background: rgba(0,0,0,0.8); border: 2px solid var(--glitch-cyan);
            padding: 10px 15px; font-family: 'Bangers'; color: var(--glitch-cyan);
            letter-spacing: 2px; font-size: 1.2rem; display: none;
            box-shadow: 0 0 10px var(--glitch-cyan);
        }

        /* --- COBWEBS & FLICKER --- */
        .cobweb {
            position: fixed; width: 350px; height: 350px; z-index: 5;
            pointer-events: none; opacity: 0.2; filter: drop-shadow(0 0 5px var(--glitch-cyan));
            transition: opacity 0.3s, filter 0.3s;
        }
        .web-top-left { top: -60px; left: -60px; }
        .web-bottom-right { bottom: -60px; right: -60px; transform: rotate(180deg); }

        .web-flicker {
            animation: web-glow 0.8s ease-in-out forwards;
        }

        @keyframes web-glow {
            0% { opacity: 0.2; filter: drop-shadow(0 0 5px var(--glitch-cyan)); }
            50% { opacity: 1; filter: drop-shadow(0 0 25px var(--glitch-cyan)) brightness(1.5); }
            100% { opacity: 0.2; filter: drop-shadow(0 0 5px var(--glitch-cyan)); }
        }

        /* --- BACKGROUNDS & OVERLAYS --- */
        #halftone-bg { position: fixed; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.05) 2px, transparent 2px); background-size: 30px 30px; z-index: -2; pointer-events: none; }
        #master-glitch { position: fixed; inset: 0; background: white; z-index: 10000001; pointer-events: none; opacity: 0; display: flex; justify-content: center; align-items: center; }

        /* --- INTRO --- */
        #intro-container {
            position: fixed; inset: 0; z-index: 10000000; background: var(--void-black);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: 0.8s cubic-bezier(0.8, 0, 0.2, 1);
        }
        #jump-button {
            background: var(--spider-red); color: white; border: 4px solid white;
            padding: 30px 60px; font-family: 'Bangers'; font-size: 3.5rem; cursor: pointer;
            box-shadow: 10px 10px 0 var(--spider-blue); transition: 0.2s;
        }
        #jump-button:hover { transform: scale(1.1) rotate(-3deg); background: var(--glitch-cyan); color: #000; }

        /* --- PANELS --- */
        .container { max-width: 1000px; margin: 0 auto; padding: 120px 20px; position: relative; z-index: 10; }
        .comic-panel {
            background: #fff; color: #000; border: 6px solid #000; padding: 40px; margin-bottom: 120px;
            position: relative; transform-style: preserve-3d; box-shadow: 20px 20px 0px var(--spider-red);
        }
        
        h1 { font-family: 'Bangers'; font-size: 4.8rem; color: #000; margin: 0; line-height: 0.9; }
        h2.module-title {
            background: #000; color: var(--comic-yellow); font-family: 'Bangers'; font-size: 2.8rem;
            display: inline-block; padding: 5px 30px; margin-top: -85px; transform: skew(-15deg);
            border: 4px solid #000; position: relative; z-index: 20;
        }

        .role-tag { font-family: 'Oswald'; font-size: 1.8rem; color: var(--spider-red); text-transform: uppercase; display: block; margin-top: 10px; line-height: 1;}
        .date-badge { background: var(--spider-blue); color: white; padding: 2px 10px; font-size: 0.9rem; font-weight: bold; }
        
        ul { list-style: none; padding: 0; margin-top: 15px; }
        li::before { content: "⚡ "; color: var(--spider-red); font-weight: bold; }
        li { margin-bottom: 15px; font-size: 1.1rem; border-bottom: 1px dashed #ccc; padding-bottom: 5px; }

        .pub-box { border: 3px solid #000; padding: 15px; margin: 12px 0; background: #f9f9f9; transition: 0.2s; font-size: 0.95rem; line-height: 1.4; }

        /* --- HOVER EFFECTS --- */
        .mission-li:hover { animation: vibrate 0.2s infinite; color: var(--spider-blue); cursor: help; }
        @keyframes vibrate { 0% { transform: translate(0); } 25% { transform: translate(2px, -2px); } 100% { transform: translate(0); } }

        .origin-card:hover { transform: scale(1.03); background: #fffde7; border-color: var(--spider-red); }
        .pub-box:hover { transform: translateX(25px); background: var(--comic-yellow); box-shadow: -15px 0 0 var(--glitch-magenta); }
        .arsenal-item:hover { text-shadow: 2px 2px var(--glitch-cyan), -2px -2px var(--glitch-magenta); background: #000; color: #fff; padding: 3px; }

        .onomatopoeia {
            position: fixed; font-family: 'Bangers'; font-size: 4rem; color: var(--comic-yellow);
            text-shadow: 4px 4px 0 #000; pointer-events: none; z-index: 99999;
            animation: comic-pop 0.4s ease-out forwards;
        }
        @keyframes comic-pop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 0; } }

        /* --- GLITCH SYSTEM --- */
        .tearing { animation: tear 0.1s infinite; opacity: 1 !important; background: var(--glitch-cyan) !important; }
        @keyframes tear { 0% { clip-path: inset(10% 0 60% 0); } 50% { clip-path: inset(40% 0 10% 0); } 100% { clip-path: inset(0 0 0 0); } }
    </style>
    <script src="/Dossier/profile.js"></script>
</head>
<body>

    <div id="dimension-hud">DIMENSION: <span id="dim-count">001</span></div>

    <svg class="cobweb web-top-left" viewBox="0 0 100 100"><path d="M0,0 L100,0 M0,0 L0,100 M0,0 L70,70 M20,0 Q20,20 0,20 M40,0 Q40,40 0,40 M60,0 Q60,60 0,60" fill="none" stroke="white" stroke-width="0.5"/></svg>
    <svg class="cobweb web-bottom-right" viewBox="0 0 100 100"><path d="M0,0 L100,0 M0,0 L0,100 M0,0 L70,70 M20,0 Q20,20 0,20 M40,0 Q40,40 0,40 M60,0 Q60,60 0,60" fill="none" stroke="white" stroke-width="0.5"/></svg>

    <div id="halftone-bg"></div>
    <div id="master-glitch"><h1>DIMENSION_SYNC_ERROR</h1></div>

    <div id="intro-container">
        <h1 style="color:white; font-size: 7rem;">BHARAT-VERSE</h1>
        <p style="color: var(--glitch-cyan); font-family: 'Bangers'; letter-spacing: 5px; margin-bottom: 40px;">// RECURSIVE LOOP INITIATED</p>
        <button id="jump-button" onclick="startExperience()">INITIATE JUMP</button>
    </div>

    <div class="container">
        <!-- CONTENT COMES FROM /Dossier/profile.js (edit that file, not this page) -->
        <section class="comic-panel" id="cv-hero"></section>

        <h2 class="module-title glitch-trigger">[ 01: EMPLOYMENT HISTORY ]</h2>
        <section class="comic-panel" id="cv-exp"></section>

        <h2 class="module-title glitch-trigger">[ 02: RESEARCH & EDUCATION ]</h2>
        <section class="comic-panel" id="cv-edu"></section>

        <h2 class="module-title glitch-trigger">[ 03: PUBLICATIONS ]</h2>
        <section class="comic-panel" id="cv-pubs"></section>

        <h2 class="module-title glitch-trigger">[ 04: PRESENTATION & TALKS ]</h2>
        <section class="comic-panel" id="cv-talks"></section>

        <h2 class="module-title glitch-trigger">[ 05: HOBBIES ]</h2>
        <section class="comic-panel" id="cv-hobbies" style="display:flex; flex-wrap:wrap; gap:12px;"></section>

        <h2 class="module-title glitch-trigger">[ 06: ARSENAL ]</h2>
        <section class="comic-panel" id="cv-skills"></section>

        <script>
        (function () {
            const P = window.PROFILE, $ = id => document.getElementById(id);
            const colors = ['var(--spider-red)', 'var(--spider-blue)'];
            $('cv-hero').innerHTML = `
                <h1 class="glitch-trigger">${P.name}</h1>
                <h3 class="role-tag">// ${P.title}</h3>
                <p style="font-size: 1.4rem; font-weight: bold; border-top: 5px solid #000; padding-top: 15px; margin-top: 15px;">${P.summary}</p>
                <div style="margin-top: 25px;">${cvMap(P.links, (l, i) => `<a href="${l.url}" target="_blank" style="background:${colors[i % 2]}; color:#fff; padding:15px; text-decoration:none; font-family:'Bangers'; border:4px solid #000; box-shadow: 5px 5px 0 #000;${i ? ' margin-left:15px;' : ''}">${l.label}</a>`)}</div>`;
            $('cv-exp').innerHTML = cvMap(P.experience, e => `
                <span class="role-tag">${e.role} | ${e.org}</span>
                <span class="date-badge">${e.dates}</span>
                <ul>${cvMap(e.bullets, b => `<li class="mission-li">${b}</li>`)}</ul>`);
            $('cv-edu').innerHTML = cvMap(P.education, (e, i, a) => `
                <div class="origin-card" style="padding:20px; border: 2px solid #ddd;${i < a.length - 1 ? ' margin-bottom: 20px;' : ''}">
                    <span class="role-tag">${e.role} | ${e.org}</span>
                    <span class="date-badge">${e.dates}</span>
                    <ul>${cvMap(e.bullets, b => `<li>${b}</li>`)}</ul>
                </div>`);
            $('cv-pubs').innerHTML = cvMap(P.publications, p => `<div class="pub-box"><b>${p.venue}:</b> ${p.title}</div>`);
            $('cv-talks').innerHTML = cvMap(P.talks, t => `<div class="pub-box"><b>${t.type}:</b> ${t.text}</div>`);
            $('cv-hobbies').innerHTML = cvMap(P.hobbies, h => `<span class="date-badge arsenal-item">${h.icon} ${h.name}: ${h.detail}</span>`);
            $('cv-skills').innerHTML = cvMap(P.skills, s => `<p><b class="arsenal-item" style="text-transform:uppercase;">${s.label}:</b> ${s.text}</p>`)
                + `<p><b>CORE EXPERTISE:</b> ${P.expertise}</p>`;
        })();
        </script>
    </div>

    <audio id="ambient-melody" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3"></audio>

    <script>
        const melody = document.getElementById('ambient-melody');
        const sfx = {
            jump: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'),
            hover: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3'),
            blip: new Audio('https://assets.mixkit.co/active_storage/sfx/2570/2570-preview.mp3'),
            boom: new Audio('https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3')
        };

        sfx.blip.volume = 0.15;
        sfx.hover.volume = 0.1;

        const dimensionColors = ['#050505', '#1a0505', '#051a05', '#05051a', '#1a1a05', '#1a001a'];
        let dimensionCount = 1;

        function startExperience() {
            sfx.jump.play();
            melody.volume = 0.2;
            melody.play().catch(e => {});
            document.getElementById('intro-container').style.transform = "translateY(-100%)";
            document.getElementById('dimension-hud').style.display = "block";
        }

        // --- GLITCH HOVER ---
        const glyphs = "अआइईউऊऋएऐওঔकখगघङЯФЖБД012345678";
        document.querySelectorAll('.glitch-trigger').forEach(el => {
            const original = el.innerText;
            el.onmouseenter = () => {
                sfx.hover.currentTime = 0; sfx.hover.play();
                let iter = 0;
                const inv = setInterval(() => {
                    el.innerText = original.split("").map((c, i) => {
                        if(i < iter) return original[i];
                        return glyphs[Math.floor(Math.random()*glyphs.length)];
                    }).join("");
                    if(iter >= original.length) clearInterval(inv);
                    iter += 1/2;
                }, 30);
            };
            el.onmouseleave = () => { el.innerText = original; };
        });

        // --- SUBTLE CLICK ---
        window.onmousedown = (e) => {
            sfx.blip.currentTime = 0; sfx.blip.play();
            const div = document.createElement('div');
            div.className = 'onomatopoeia'; 
            div.innerText = "PING";
            div.style.left = e.clientX + 'px'; div.style.top = e.clientY + 'px';
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 400);
        };

        // --- RECURSIVE RESET WITH COBWEB FLICKER ---
        window.onscroll = () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 5) {
                const glitch = document.getElementById('master-glitch');
                glitch.classList.add('tearing');
                
                // Audio Speedup
                melody.playbackRate = 2.5; 
                sfx.boom.play();

                // Web Flicker
                document.querySelectorAll('.cobweb').forEach(web => web.classList.add('web-flicker'));
                
                setTimeout(() => {
                    window.scrollTo(0, 0);
                    glitch.classList.remove('tearing');
                    melody.playbackRate = 1.0; 
                    
                    dimensionCount++;
                    document.getElementById('dim-count').innerText = dimensionCount.toString().padStart(3, '0');
                    document.body.style.setProperty('--dim-bg', dimensionColors[dimensionCount % dimensionColors.length]);
                    
                    // Remove flicker class after reset
                    setTimeout(() => {
                        document.querySelectorAll('.cobweb').forEach(web => web.classList.remove('web-flicker'));
                    }, 500);
                }, 700);
            }
        };

        // --- PARALLAX ---
        window.onmousemove = (e) => {
            const x = (window.innerWidth/2 - e.clientX)/85;
            const y = (window.innerHeight/2 - e.clientY)/85;
            document.querySelectorAll('.comic-panel').forEach(p => {
                p.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
            });
        };
    </script>
</body>
</html>
